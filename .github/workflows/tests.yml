name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # The acceptance gate skips rather than fails if its data is missing, so a
      # lost CSV would show as a green run with one fewer test. Fail loudly here
      # instead.
      - name: Check bundled acceptance data is present
        run: |
          test -f data/BTC-USD-1d-2023.csv
          test -f data/BTCUSD-1d-2023-bitstamp.csv

      - name: Run tests
        run: python -m pytest -rs

      - name: Smoke-test the CLI
        run: python scripts/run_backtest.py --data data/BTC-USD-1d-2023.csv --symbol BTC-USD
