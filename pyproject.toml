[project]
name = "trading-lab-harness"
version = "0.1.0"
description = "Point-in-time crypto backtest harness where look-ahead bias raises an exception"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.setuptools.packages.find]
include = ["harness*"]
